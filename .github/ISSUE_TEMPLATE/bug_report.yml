name: Bug report
description: The portal, API, client or an RTSTRUCT export behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never attach patient images, RTSTRUCTs, identifiers, licence keys or logs that contain them.
        Describe the input by modality, orientation, slice count and spacing, or reproduce with synthetic data.
  - type: input
    id: version
    attributes:
      label: RTsegmentator version
      description: The `version` field of `GET /api/v1/config`, or the commit you run.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model task name(s)
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: API calls, client commands or UI steps; synthetic or public data only.
  - type: textarea
    id: environment
    attributes:
      label: Deployment
      description: Worker mode (local or SSH), GPU model and driver, container image digest.
