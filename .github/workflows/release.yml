name: release

# Pushing a tag vX.Y.Z publishes the GitHub release with the matching CHANGELOG.md
# section. The tag must equal rtseg_version.py; Zenodo archives published releases
# when its GitHub integration is enabled for this repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Extract release notes for the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          tag = os.environ["TAG"]
          version = re.search(r'__version__ = "([^"]+)"', Path("rtseg_version.py").read_text()).group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match rtseg_version.py {version}")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## {re.escape(version)} — .*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          Path("release-title.txt").write_text(f"RTsegmentator {version}\n")
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
