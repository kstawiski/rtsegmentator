services:
  rtsegmentator:
    build: .
    image: rtsegmentator:1.0
    ports:
      - "8080:8080"
    environment:
      WORKER_MODE: ${WORKER_MODE:-local}
      REMOTE_GPU_TASKS: ${REMOTE_GPU_TASKS:-}
      SEGMENTATION_WORKER: ${SEGMENTATION_WORKER:-worker@rtsegmentator-worker}
      REMOTE_JOB_ROOT: ${REMOTE_JOB_ROOT:-/data/remote-jobs}
      REMOTE_PYTHON: ${REMOTE_PYTHON:-/opt/rtsegmentator/venv/bin/python}
      REMOTE_RUNNER: ${REMOTE_RUNNER:-/app/run_task.py}
      REMOTE_APP_ROOT: ${REMOTE_APP_ROOT:-/app}
      REMOTE_MODEL_ROOT: ${REMOTE_MODEL_ROOT:-/models}
      REMOTE_RUNTIME_ROOT: ${REMOTE_RUNTIME_ROOT:-/runtimes}
      REMOTE_SCRATCH_ROOT: ${REMOTE_SCRATCH_ROOT:-/scratch}
      REMOTE_NV_REASON_CT_CACHE: ${REMOTE_NV_REASON_CT_CACHE:-/scratch/nv-reason-ct-cache}
      REMOTE_TOTALSEG_WEIGHTS_PATH: ${REMOTE_TOTALSEG_WEIGHTS_PATH:-}
      RTSEG_NV_REASON_CT_COVERAGE_MODE: ${RTSEG_NV_REASON_CT_COVERAGE_MODE:-fast}
      PORTAL_DATA: /data
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8589934592}
      ENABLED_EXTERNAL_MODELS: ${ENABLED_EXTERNAL_MODELS:-}
      ENABLED_MODELS_FILE: /data/enabled-models.txt
      CATALOG_TTL_SECONDS: ${CATALOG_TTL_SECONDS:-600}
      PREFLIGHT_TIMEOUT_SECONDS: ${PREFLIGHT_TIMEOUT_SECONDS:-900}
      TASK_TIME_LIMIT_SECONDS: ${TASK_TIME_LIMIT_SECONDS:-43200}
      TASK_STOP_GRACE_SECONDS: ${TASK_STOP_GRACE_SECONDS:-45}
      RTSEG_APP_ROOT: /app
      RTSEG_SCRATCH_ROOT: /scratch
      RTSEG_MODEL_ROOT: /models
      RTSEG_RUNTIME_ROOT: /runtimes
    volumes:
      - rtsegmentator-data:/data
      - rtsegmentator-scratch:/scratch
      - totalsegmentator-home:/root/.totalsegmentator
      - ${RTSEG_MODEL_BUNDLE:-./models}:/models:ro
      - ${RTSEG_RUNTIME_BUNDLE:-./runtimes}:/runtimes:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  rtsegmentator-data:
  rtsegmentator-scratch:
  totalsegmentator-home:
