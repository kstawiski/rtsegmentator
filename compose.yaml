services:
  rtsegmentator:
    build: .
    image: rtsegmentator:1.0
    ports:
      - "8080:8080"
    environment:
      WORKER_MODE: local
      PORTAL_DATA: /data
      RETENTION_HOURS: "24"
      RTSEG_MODEL_ROOT: /models
      RTSEG_RUNTIME_ROOT: /runtimes
    volumes:
      - rtsegmentator-data:/data
      - ${RTSEG_MODEL_BUNDLE:-./models}:/models:ro
      - ${RTSEG_RUNTIME_BUNDLE:-./runtimes}:/runtimes:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  rtsegmentator-data:
