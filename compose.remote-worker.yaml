services:
  worker:
    build: .
    image: rtsegmentator:1.0
    command: ["worker-ssh"]
    ports:
      - "2222:2222"
    environment:
      SSH_AUTHORIZED_KEY: ${SSH_AUTHORIZED_KEY:?set SSH_AUTHORIZED_KEY}
      RTSEG_MODEL_ROOT: /models
      RTSEG_RUNTIME_ROOT: /runtimes
    volumes:
      - worker-jobs:/home/worker/jobs
      - ${RTSEG_MODEL_BUNDLE:-./models}:/models:ro
      - ${RTSEG_RUNTIME_BUNDLE:-./runtimes}:/runtimes:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  worker-jobs:
