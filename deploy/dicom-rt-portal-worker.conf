[program:dicom-rt-portal]
command=/opt/rtsegmentator/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8080 --workers 1
directory=/app
environment=PYTHONUNBUFFERED="1",PORTAL_DATA="/data",WORKER_MODE="local",RTSEG_APP_ROOT="/app",RTSEG_MODEL_ROOT="/models",RTSEG_RUNTIME_ROOT="/runtimes",RTSEG_SCRATCH_ROOT="/scratch"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/data/portal.log
stderr_logfile=/data/portal-error.log
