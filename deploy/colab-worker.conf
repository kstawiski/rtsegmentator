# Optional systemd override for an explicitly configured Colab worker.
# Credentials remain in the external CLI configuration.
[Service]
Environment=WORKER_MODE=colab
Environment=COLAB_CLI=colab
Environment=COLAB_ORCHESTRATOR=worker
Environment=COLAB_GPU=T4
Environment=COLAB_AUTH=oauth2
Environment=REMOTE_JOB_ROOT=/data/jobs
Environment=REMOTE_PYTHON=/opt/rtsegmentator/venv/bin/python
Environment=REMOTE_RUNNER=/app/run_task.py
Environment=REMOTE_APP_ROOT=/app
Environment=REMOTE_MODEL_ROOT=/models
Environment=REMOTE_RUNTIME_ROOT=/runtimes
